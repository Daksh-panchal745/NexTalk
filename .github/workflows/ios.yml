name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Code download karo
        uses: actions/checkout@v4

      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Packages install
        run: npm install

      - name: iOS project banao
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Unsigned build
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: .ipa pack karo
        run: |
          cd ios/App
          mkdir Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r ../../NexTalk.ipa Payload

      - name: .ipa upload karo
        uses: actions/upload-artifact@v4
        with:
          name: NexTalk-ipa
          path: NexTalk.ipa